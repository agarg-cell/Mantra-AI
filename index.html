// ── AI Hook — /api/chat (Vercel serverless proxy) ──
function useAI(){
  const [ready]=useState(true);
  const run=useCallback(async(prompt,onChunk)=>{
    const res=await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({prompt})
    });
    if(!res.ok) throw new Error('API error '+res.status);
    const reader=res.body.getReader();
    const dec=new TextDecoder();
    let buf='';
    while(true){
      const{done,value}=await reader.read();
      if(done) break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n');
      buf=lines.pop()||'';
      for(const line of lines){
        if(line.startsWith('data: ')){
          const d=line.slice(6).trim();
          if(d==='[DONE]') continue;
          try{const p=JSON.parse(d);const t=p?.delta?.text||'';if(t)onChunk(t);}catch{}
        }
      }
    }
  },[]);
  return {ready,run};
}

      default: return React.createElement(Dashboard);

      currentGroup={label:item.group,items:[item]};
